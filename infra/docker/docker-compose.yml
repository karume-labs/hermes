name: hermes

services:
  postgres:
    image: postgres:17-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
    # Host port matches packages/db/.env so `bun run db:seed` works against a
    # compose-managed database; 5434 avoids the other local Postgres instances.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - hermes_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hermes} -d ${POSTGRES_DB:-hermes}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hermes-network

  elysia-api:
    image: ghcr.io/hermes/elysia-api:${IMAGE_TAG:-latest}
    container_name: hermes-elysia-api
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:-hermes}@postgres:5432/${POSTGRES_DB:-hermes}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - hermes-network

  next-web:
    image: ghcr.io/hermes/next-web:${IMAGE_TAG:-latest}
    container_name: hermes-next-web
    restart: unless-stopped
    env_file:
      - ../../apps/web/.env
    depends_on:
      elysia-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - hermes-network

  caddy-proxy:
    image: caddy:2-alpine
    container_name: hermes-caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - next-web
    networks:
      - hermes-network

volumes:
  caddy_data:
  caddy_config:
  hermes_db:

networks:
  hermes-network:
    driver: bridge
